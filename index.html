    --green-dark: #006847;
    --red: #c8102e;
    --gold: #FFD700;

    --bg2: #0d1a2b;
    --bg3: #111f33;
    --surface: rgba(255,255,255,0.05);
    --border: rgba(255,255,255,0.09);
    --text: #f0f0f0;
    --muted: rgba(255,255,255,0.45);

    --safe-bottom: env(safe-area-inset-bottom, 0px);

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {

    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  /* ── LOADING ── */
  #loading {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; z-index: 1000;
    transition: opacity 0.4s;
  }
  #loading.hide { opacity: 0; pointer-events: none; }
  .loader-ball {
    width: 56px; height: 56px; font-size: 48px;
    animation: spin 1.2s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-text { font-family: var(--font-display); font-size: 28px; letter-spacing: 4px; color: var(--gold); }
  .loader-sub { font-size: 13px; color: var(--muted); }

  /* ── HEADER ── */
  #header {
    background: linear-gradient(135deg, #c8102e 0%, #9b0a22 40%, #006847 100%);
    padding: 14px 16px 0;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    flex-shrink: 0;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  }
  .header-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .header-ball { font-size: 28px; }
  .header-title { font-family: var(--font-display); font-size: 26px; letter-spacing: 3px; line-height: 1; }
  .header-sub { font-size: 10px; color: rgba(255,255,255,0.75); letter-spacing: 2px; }
  .header-user {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
    background: rgba(0,0,0,0.25);
    border-radius: 20px; padding: 5px 12px;
    cursor: pointer; border: none; color: white;
    font-family: var(--font-body); font-size: 13px; font-weight: 600;
  }
  .admin-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--gold); display: none;
  }
  .admin-dot.on { display: block; }

  /* ── TABS ── */
  .tabs {
    display: flex; overflow-x: auto;
    scrollbar-width: none; gap: 0;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0; border: none; background: transparent;
    color: rgba(255,255,255,0.6); padding: 10px 16px;
    font-family: var(--font-body); font-size: 12px; font-weight: 700;
    letter-spacing: 0.5px; cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all 0.2s; white-space: nowrap;
  }
  .tab.active { color: white; border-bottom-color: var(--gold); }
  .tab-admin { display: none; }
  .tab-admin.show { display: block; }

  /* ── SCROLL BODY ── */
  #app {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 16px 14px;
    padding-bottom: calc(20px + var(--safe-bottom));
    -webkit-overflow-scrolling: touch;
  }

  /* ── CARDS / SECTIONS ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px; padding: 18px; margin-bottom: 14px;
  }
  .card-title { font-family: var(--font-display); font-size: 22px; letter-spacing: 2px; margin-bottom: 16px; }

  /* ── LOGIN SCREEN ── */

    min-height: 70vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; text-align: center;
  }
  .login-ball { font-size: 64px; margin-bottom: 8px; animation: bounce 2s ease-in-out infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  .login-title { font-family: var(--font-display); font-size: 36px; letter-spacing: 4px; color: var(--gold); }
  .login-sub { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .login-input {
    width: 100%; max-width: 280px;
    background: rgba(255,255,255,0.08); border: 1px solid var(--border);
    border-radius: 12px; color: white; padding: 14px 18px;
    font-family: var(--font-body); font-size: 15px; outline: none;
    transition: border 0.2s;
  }
  .login-input:focus { border-color: var(--green); }
  .btn-primary {
    width: 100%; max-width: 280px;
    background: linear-gradient(135deg, var(--green-dark), var(--green));
    border: none; color: white; padding: 14px;
    border-radius: 12px; font-family: var(--font-body);
    font-size: 15px; font-weight: 700; cursor: pointer;
    transition: opacity 0.2s; letter-spacing: 0.5px;
  }
  .btn-primary:active { opacity: 0.8; }
  .login-error { color: #e63946; font-size: 13px; min-height: 18px; }
  .login-toggle { color: var(--muted); font-size: 13px; cursor: pointer; text-decoration: underline; }

  /* ── GROUP FILTER ── */
  .group-filter { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .gf-btn {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--muted); padding: 5px 11px; border-radius: 8px;
    font-family: var(--font-body); font-size: 11px; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
  }
  .gf-btn.active { background: var(--red); color: white; border-color: var(--red); }

  /* ── GROUP CARD ── */
  .group-card { border: 1px solid var(--border); border-radius: 14px; margin-bottom: 14px; overflow: hidden; }

    background: linear-gradient(90deg, #9b0a22, #c8102e);
    padding: 8px 14px; font-family: var(--font-display);

    display: flex; align-items: center; gap: 10px;

  .team-pill {
    background: rgba(255,255,255,0.07); border-radius: 6px;
    padding: 3px 8px; font-size: 11px;
  }

  /* ── FIXTURE ROW ── */

    border-top: 1px solid rgba(255,255,255,0.05);

  }
  .fixture-date { font-size: 10px; color: var(--muted); margin-bottom: 5px; }
  .fixture-row {

  .team-name { flex: 1; font-size: 12px; font-weight: 600; }
  .team-name.away { text-align: right; }
  .score-wrap { display: flex; align-items: center; gap: 5px; }
  .score-box {

    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px; color: white;
    font-size: 16px; font-weight: 700; text-align: center;
    padding: 5px 2px; outline: none;
    font-family: var(--font-body);
    -moz-appearance: textfield;

  .score-sep { color: var(--muted); font-weight: 700; font-size: 14px; }

  .pts-1 { background: #f4a261; }
  .pts-0 { background: #e63946; }
  .pts-pending { background: rgba(255,255,255,0.12); color: var(--muted); }

  .leader-rank { font-size: 20px; width: 32px; text-align: center; }
  .leader-name { flex: 1; font-weight: 700; font-size: 15px; }
  .leader-score { font-family: var(--font-display); font-size: 26px; color: var(--gold); letter-spacing: 1px; }
  .leader-breakdown { font-size: 11px; color: var(--muted); }

    font-family: var(--font-display); font-size: 18px; letter-spacing: 1px;

    font-size: 12px; font-weight: 600; color: #e63946;
    display: flex; align-items: center; gap: 8px;

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: calc(20px + var(--safe-bottom)); left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: rgba(20,30,50,0.95); color: white;
    padding: 10px 20px; border-radius: 20px;
    font-size: 13px; font-weight: 600;
    border: 1px solid var(--border);
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
    z-index: 500; white-space: nowrap;
    backdrop-filter: blur(10px);
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  .empty-state { text-align: center; color: var(--muted); padding: 32px 0; font-size: 14px; }

  .rules-box { background: rgba(255,215,0,0.05); border: 1px solid rgba(255,215,0,0.18); border-radius: 12px; padding: 14px; margin-top: 16px; }
  .rules-box h3 { font-family: var(--font-display); font-size: 16px; letter-spacing: 1px; color: var(--gold); margin-bottom: 10px; }
  .rule-item { font-size: 13px; color: rgba(255,255,255,0.8); margin-bottom: 6px; }
  input[type=number]:focus { border-color: var(--green) !important; }

  .install-text strong { display: block; font-size: 14px; font-weight: 700; }
  .install-text span { font-size: 12px; opacity: 0.8; }
  .install-btn { background: white; color: var(--green-dark); border: none; padding: 8px 16px; border-radius: 8px; font-weight: 800; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .install-close { background: none; border: none; color: white; font-size: 20px; cursor: pointer; opacity: 0.7; padding: 0 4px; }

// SUPABASE CLIENT (vanilla, no npm)
// ═══════════════════════════════════════════════════════════════════════
async function sbFetch(path, opts = {}) {
  const url = SUPABASE_URL + path;
  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json',
    'Prefer': opts.prefer || 'return=representation',
    ...opts.headers
  };
  const res = await fetch(url, { method: opts.method || 'GET', headers, body: opts.body });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(err);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : [];
}

async function dbSelect(table, params = '') {
  return sbFetch(`/rest/v1/${table}?${params}`);
}
async function dbInsert(table, data) {
  return sbFetch(`/rest/v1/${table}`, { method: 'POST', body: JSON.stringify(data) });
}
async function dbUpsert(table, data) {
  return sbFetch(`/rest/v1/${table}`, {
    method: 'POST', body: JSON.stringify(data),
    prefer: 'resolution=merge-duplicates,return=representation',
    headers: { 'Prefer': 'resolution=merge-duplicates,return=representation' }
  });
}
async function dbDelete(table, params) {
  return sbFetch(`/rest/v1/${table}?${params}`, { method: 'DELETE', prefer: '' });
}

// Realtime via SSE
function subscribeRealtime(tables, callback) {
  // Supabase realtime via websocket — use polling fallback for simplicity in vanilla JS
  setInterval(async () => {
    try { await callback(); } catch(e) {}
  }, 8000); // poll every 8s
}

// SCORING
// ═══════════════════════════════════════════════════════════════════════
function calcPoints(pred, actual) {
  if (!actual || actual.home_score == null || actual.away_score == null) return null;
  if (!pred || pred.home_score == null || pred.away_score == null) return 0;
  const ph = +pred.home_score, pa = +pred.away_score;
  const ah = +actual.home_score, aa = +actual.away_score;
  if (ph === ah && pa === aa) return 3;
  const pr = ph > pa ? 'H' : ph < pa ? 'A' : 'D';
  const ar = ah > aa ? 'H' : ah < aa ? 'A' : 'D';
  return pr === ar ? 1 : 0;
}

async function getPlayerTotal(playerId) {
  // Fetch predictions for this player
  const preds = await dbSelect('predictions', `player_id=eq.${playerId}`);
  const predMap = {};
  preds.forEach(p => predMap[p.fixture_id] = p);
  let total = 0;
  FIXTURES.forEach(f => {
    const pt = calcPoints(predMap[f.id], allResults[f.id]);
    if (pt !== null) total += pt;
  });
  // Knockout picks
  const koPicks = await dbSelect('knockout_picks', `player_id=eq.${playerId}`);
  koPicks.forEach(k => {
    if (allKoResults[k.round] && allKoResults[k.round].includes(k.team)) total += 2;
  });
  return total;
}

async function init() {
  // Check stored session
  const stored = localStorage.getItem('quiniela_session');
  if (stored) {
    try {
      const s = JSON.parse(stored);
      // Verify still exists in db
      const rows = await dbSelect('players', `id=eq.${s.id}&pin=eq.${s.pin}`);
      if (rows && rows.length > 0) {
        currentPlayer = rows[0];
        await postLogin();
        return;
      }
    } catch(e) {}
    localStorage.removeItem('quiniela_session');
  }
  hideLoading();
  showLogin();
}

function hideLoading() {
  const el = document.getElementById('loading');
  el.classList.add('hide');
  setTimeout(() => el.style.display = 'none', 400);
}

async function postLogin() {
  localStorage.setItem('quiniela_session', JSON.stringify({id: currentPlayer.id, pin: currentPlayer.pin}));
  document.getElementById('user-label').textContent = currentPlayer.name;
  document.getElementById('header').style.display = '';
  if (currentPlayer.is_admin) {
    document.getElementById('admin-dot').classList.add('on');
    document.getElementById('tab-results').classList.add('show');
  }
  await loadGlobalData();
  await loadMyData();
  hideLoading();
  switchTab('leaderboard');
  // Start polling for updates
  subscribeRealtime(['predictions','results','knockout_picks'], async () => {
    await loadGlobalData();
    if (currentTab === 'leaderboard') renderLeaderboard();
    if (currentTab === 'predict') renderPredict();
  });
}

async function loadGlobalData() {
  try {
    const [players, results, koResults] = await Promise.all([
      dbSelect('players', 'select=id,name,is_admin'),
      dbSelect('results'),
      dbSelect('knockout_results'),
    ]);
    allPlayers = players;
    allResults = {};
    results.forEach(r => allResults[r.fixture_id] = r);
    allKoResults = {};
    koResults.forEach(r => {
      if (!allKoResults[r.round]) allKoResults[r.round] = [];
      allKoResults[r.round].push(r.team);
    });
  } catch(e) { console.warn('loadGlobalData:', e); }
}

async function loadMyData() {
  if (!currentPlayer) return;
  try {
    const [preds, koPicks] = await Promise.all([
      dbSelect('predictions', `player_id=eq.${currentPlayer.id}`),
      dbSelect('knockout_picks', `player_id=eq.${currentPlayer.id}`),
    ]);
    myPredictions = {};
    preds.forEach(p => myPredictions[p.fixture_id] = p);
    myKoPicks = {};
    koPicks.forEach(k => {
      if (!myKoPicks[k.round]) myKoPicks[k.round] = [];
      myKoPicks[k.round].push(k.team);
    });
  } catch(e) { console.warn('loadMyData:', e); }
}

async function doLogin() {
  const name = document.getElementById('l-name').value.trim();
  const pin = document.getElementById('l-pin').value.trim();
  if (!name || !pin) { setLoginError('Completa todos los campos'); return; }
  setLoginError('Verificando...');
  try {
    const rows = await dbSelect('players', `name=ilike.${encodeURIComponent(name)}&pin=eq.${pin}`);
    if (!rows || rows.length === 0) { setLoginError('Nombre o PIN incorrecto'); return; }
    currentPlayer = rows[0];
    await postLogin();
  } catch(e) { setLoginError('Error de conexión. Revisa tu internet.'); }

async function doRegister() {
  const name = document.getElementById('l-name').value.trim();
  const pin = document.getElementById('l-pin').value.trim();
  if (!name || pin.length < 4) { setLoginError('Nombre y PIN de mínimo 4 dígitos'); return; }
  setLoginError('Registrando...');
  try {
    // Check name not taken
    const existing = await dbSelect('players', `name=ilike.${encodeURIComponent(name)}`);
    if (existing && existing.length > 0) { setLoginError('Ese nombre ya está en uso'); return; }
    const isAdmin = (pin === ADMIN_PIN);
    const rows = await dbInsert('players', {name, pin, is_admin: isAdmin});
    if (!rows || rows.length === 0) throw new Error('No rows returned');
    currentPlayer = rows[0];
    await postLogin();
  } catch(e) { setLoginError('Error al registrar: ' + e.message); }
}

async function renderLeaderboard() {
  document.getElementById('app').innerHTML = `<div style="text-align:center;padding:40px 0;color:var(--muted)">Calculando puntos...</div>`;
  await loadGlobalData();
  // Fetch all predictions + ko picks
  let scores = [];
  for (const p of allPlayers) {
    const [preds, koPicks] = await Promise.all([
      dbSelect('predictions', `player_id=eq.${p.id}`),
      dbSelect('knockout_picks', `player_id=eq.${p.id}`),
    ]);
    const predMap = {};
    preds.forEach(pr => predMap[pr.fixture_id] = pr);
    let total = 0, exact = 0, correct = 0, pending = 0;
    FIXTURES.forEach(f => {
      const pt = calcPoints(predMap[f.id], allResults[f.id]);
      if (pt === null) pending++;
      else if (pt === 3) { total += 3; exact++; }
      else if (pt === 1) { total += 1; correct++; }
    });
    koPicks.forEach(k => {
      if (allKoResults[k.round] && allKoResults[k.round].includes(k.team)) total += 2;
    });
    scores.push({...p, total, exact, correct, pending});
  }
  scores.sort((a, b) => b.total - a.total);

  const medals = ['🥇','🥈','🥉'];
  const rows = scores.map((p, i) => `
    <div class="leader-row ${i===0?'first':''}">
      <div class="leader-rank">${medals[i] || '#'+(i+1)}</div>
      <div>
        <div class="leader-name">${p.name}${p.is_admin?' 🔑':''}</div>
        <div class="leader-breakdown">🎯${p.exact} exactos · ✅${p.correct} resultados · ⏳${p.pending}</div>
      </div>
      <div class="leader-score">${p.total}</div>
    </div>`).join('');

  document.getElementById('app').innerHTML = `
    <div class="card-title" style="font-family:var(--font-display);font-size:22px;letter-spacing:2px;margin-bottom:14px">🏅 CLASIFICACIÓN</div>
    ${scores.length === 0 ? '<div class="empty-state">Aún no hay jugadores registrados.</div>' : rows}
    <div class="rules-box">
      <h3>📋 PUNTUACIÓN</h3>
      <div class="rule-item">🎯 <strong>3 pts</strong> — Resultado exacto (ej: 2-1)</div>
      <div class="rule-item">✅ <strong>1 pt</strong> — Resultado correcto (ganador/empate)</div>
      <div class="rule-item">🏆 <strong>2 pts</strong> — Equipo avanza en eliminatorias</div>
    </div>`;
}

let pendingScores = {}; // buffer before upsert

async function savePred(fixtureId, side, val) {
  if (!currentPlayer) return;
  if (!pendingScores[fixtureId]) pendingScores[fixtureId] = {...(myPredictions[fixtureId]||{})};
  if (side === 'home') pendingScores[fixtureId].home_score = val === '' ? null : +val;
  else pendingScores[fixtureId].away_score = val === '' ? null : +val;

  clearTimeout(saveDebounce);
  saveDebounce = setTimeout(async () => {
    try {
      for (const [fid, scores] of Object.entries(pendingScores)) {
        await dbUpsert('predictions', {
          player_id: currentPlayer.id,
          fixture_id: +fid,
          home_score: scores.home_score,
          away_score: scores.away_score,
        });
        myPredictions[+fid] = scores;
      }
      pendingScores = {};
      showSaved();
    } catch(e) { toast('❌ Error al guardar'); }
  }, 800);
}

async function renderKnockout() {
  await loadMyData();

    const actual = allKoResults[r.id] || [];
    const count = `<span class="ko-count">${selected.length}/${r.max}</span>`;
    const teamBtns = ALL_TEAMS.map(t => {
      const isOn = selected.includes(t);
      const isCorrect = actual.includes(t) && isOn;
      return `<button class="team-toggle ${isCorrect?'correct':isOn?'on':''}"
        onclick="toggleKo('${r.id}',${r.max},'${t.replace(/'/g,"\\'")}',this)">
        ${FLAGS[t]||''} ${t}
      </button>`;
    }).join('');
    return `
      <div class="ko-round">
        <div class="ko-round-header">${r.label} ${count}</div>

    ${rounds}`;
}

async function toggleKo(round, max, team, btn) {
  if (!currentPlayer) return;
  const cur = myKoPicks[round] || [];
  const isOn = cur.includes(team);
  if (!isOn && cur.length >= max) { toast(`Máximo ${max} equipos para esta ronda`); return; }

  try {
    if (isOn) {
      await dbDelete('knockout_picks', `player_id=eq.${currentPlayer.id}&round=eq.${round}&team=eq.${encodeURIComponent(team)}`);
      myKoPicks[round] = cur.filter(t => t !== team);
      btn.classList.remove('on','correct');
    } else {
      await dbUpsert('knockout_picks', {player_id: currentPlayer.id, round, team});
      if (!myKoPicks[round]) myKoPicks[round] = [];
      myKoPicks[round].push(team);
      btn.classList.add('on');
    }
    // Update count
    const header = btn.closest('.ko-round').querySelector('.ko-round-header');
    const countEl = header.querySelector('.ko-count');
    if (countEl) countEl.textContent = `${myKoPicks[round].length}/${max}`;
    showSaved();
  } catch(e) { toast('❌ Error al guardar'); }
}

    return `
      <div class="ko-round">
        <div class="ko-round-header">${r.label} <span class="ko-count">${actual.length}/${r.max}</span></div>
        <div class="team-grid">${teamBtns}</div>
      </div>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <div class="admin-banner">🔓 Modo Admin — Ingresa resultados reales aquí</div>
    <div class="card-title" style="font-family:var(--font-display);font-size:20px;letter-spacing:2px;margin-bottom:12px">✏️ FASE DE GRUPOS</div>
    <div class="group-filter">${groupBtns}</div>
    ${groupCards}
    <div class="card-title" style="font-family:var(--font-display);font-size:20px;letter-spacing:2px;margin:20px 0 12px">✏️ ELIMINATORIAS</div>
    ${koSection}`;
}

function setGroupResults(g) { currentGroup = g; renderResults(); }

let pendingResults = {};
async function saveResult(fixtureId, side, val) {
  if (!pendingResults[fixtureId]) pendingResults[fixtureId] = {...(allResults[fixtureId]||{})};
  if (side === 'home') pendingResults[fixtureId].home_score = val === '' ? null : +val;
  else pendingResults[fixtureId].away_score = val === '' ? null : +val;

  clearTimeout(saveDebounce);
  saveDebounce = setTimeout(async () => {
    try {
      for (const [fid, scores] of Object.entries(pendingResults)) {
        await dbUpsert('results', { fixture_id: +fid, home_score: scores.home_score, away_score: scores.away_score });
        allResults[+fid] = scores;
      }
      pendingResults = {};
      showSaved();
    } catch(e) { toast('❌ Error: ' + e.message); }
  }, 800);
}

async function toggleKoResult(round, team, btn) {
  const cur = allKoResults[round] || [];
  const isOn = cur.includes(team);
  try {
    if (isOn) {
      await dbDelete('knockout_results', `round=eq.${round}&team=eq.${encodeURIComponent(team)}`);
      allKoResults[round] = cur.filter(t => t !== team);
      btn.classList.remove('on');
    } else {
      await dbUpsert('knockout_results', {round, team});
      if (!allKoResults[round]) allKoResults[round] = [];
      allKoResults[round].push(team);
      btn.classList.add('on');
    }
    showSaved();
  } catch(e) { toast('❌ Error: ' + e.message); }
}

// ═══════════════════════════════════════════════════════════════════════
// UI UTILS
// ═══════════════════════════════════════════════════════════════════════
function showSaved() {
  const el = document.getElementById('saving-indicator');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1800);
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ═══════════════════════════════════════════════════════════════════════
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstall = e;
  const banner = document.getElementById('install-banner');
  banner.style.display = 'flex';
  document.getElementById('install-btn').addEventListener('click', () => {
    deferredInstall.prompt();
    banner.style.display = 'none';
  });
});

});
